<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friends · Mental Math Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤝</text></svg>">
</head>
<body data-themed>
  <div class="wrap">
    <header class="top">
      <div>
        <a class="wordmark" href="index.html" style="font-size:clamp(2rem,5vw,3rem)">Friends</a>
        <p class="tagline">Add classmates by their username and see who's on right now.</p>
      </div>
      <div>
        <nav class="nav" aria-label="Main"><a href="index.html">Back to games</a><a href="hangar.html">Hangar</a><a href="leaderboards.html">Leaderboards</a></nav>
      </div>
    </header>

    <main class="friends-page" id="main" hidden>
      <div class="friends-side">
        <form class="panel" id="addForm">
          <h2>Add a friend</h2>
          <label class="field">Your friend's username
            <input id="addName" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Like MayaR" maxlength="30" required>
          </label>
          <p class="add-msg" id="addMsg" role="status"></p>
          <button class="btn btn-primary" id="addBtn" type="submit">Send friend request</button>
          <p class="note">Your username is <b id="myName"></b>. Tell a friend so they can add you.</p>
        </form>

        <section class="panel requests" id="reqPanel" aria-labelledby="h-req" hidden>
          <h2 id="h-req">Friend requests</h2>
          <ul class="req-list" id="reqList"></ul>
        </section>

        <section class="sent" id="sentBox" aria-labelledby="h-sent" hidden>
          <h3 id="h-sent">Waiting for an answer</h3>
          <ul id="sentList"></ul>
        </section>
      </div>

      <section class="friends-main" aria-labelledby="h-friends">
        <h2 id="h-friends">Your friends <span class="friend-count" id="friendCount"></span></h2>
        <p class="error" id="err" role="alert"></p>
        <div class="pal-grid" id="palGrid"></div>
      </section>
    </main>
    <p id="loading">Loading…</p>
  </div>
  <div class="toast" id="toast" hidden role="status"></div>
  <script src="js/config.js"></script>
  <script src="js/games.js"></script>
  <script src="js/problems.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/help.js"></script>
  <script src="js/friends.js"></script>
</body>
</html>
